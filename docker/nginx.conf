##
## nginx configuration for the LabCare Diagnostics SPA.
##
## Served as a non-root user on port 8080 (nginx-unprivileged default).
## Handles: SPA history fallback, long-lived asset caching, compression,
## baseline security headers, and a container health endpoint.
##

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Don't advertise the exact nginx version.
    server_tokens off;

    # ---------------------------------------------------------------- compression
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ------------------------------------------------------------ security headers
    # Baseline policy for every response. The rules live in one file because a
    # nested `add_header` replaces the parent level's headers instead of merging
    # with them — every location below that sets its own headers must re-include
    # this snippet, or it will serve its content with no CSP at all.
    include /etc/nginx/snippets/security-headers.conf;

    # --------------------------------------------------------------- health check
    # No add_header here, so this location inherits the policy from `server`.
    location = /healthz {
        access_log off;
        # `default_type` sets one Content-Type; `add_header Content-Type` would
        # append a second, duplicate one.
        default_type text/plain;
        return 200 "ok\n";
    }

    # ------------------------------------------------- hashed assets: cache hard
    # Vite emits content-hashed filenames, so these files are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Images / icons: cache but revalidate occasionally.
    location ~* \.(?:jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # ------------------------------------------------------- SPA history fallback
    # This location serves index.html AND every deep link (/packages,
    # /my-bookings/*, /admin/*), so re-applying the policy here matters most.
    location / {
        # index.html is never cached so a new deploy is picked up immediately.
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Never serve dotfiles.
    location ~ /\. {
        deny all;
    }
}

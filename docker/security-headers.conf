##
## Shared security headers — single source of truth.
##
## WHY THIS FILE EXISTS
## nginx does NOT merge `add_header` values with the parent level: values set at
## `server` scope are inherited only by blocks that define no `add_header` of
## their own. Every location in nginx.conf that sets a Cache-Control header
## therefore switches inheritance OFF, and would silently ship the HTML document,
## the JS/CSS bundle and images with no CSP or hardening headers at all.
##
## So: `include` this file in the `server` block AND in every location that sets
## its own headers.   add_header_inherit merge;  would remove the need for the
## repetition, but that directive needs nginx 1.29.3+ and the runtime image is
## nginx-unprivileged:1.27-alpine.
##
## Usage:   include /etc/nginx/snippets/security-headers.conf;
##
## POLICIES
## - `script-src 'self'` with no 'unsafe-inline'/no 'unsafe-eval' — there are no
##   inline <script> tags or eval() calls anywhere in the app.
## - `style-src 'unsafe-inline'` is required: the printable receipt and report
##   documents are generated HTML that uses inline <style> blocks and style=""
##   attributes, and they inherit this policy when opened.
## - `img-src`/`font-src` allow data: (inline SVG/fonts) and img-src allows blob:
##   (generated images), `object-src 'none'`, `frame-ancestors 'self'` (no
##   clickjacking of the admin console), `base-uri` and `form-action` locked to
##   'self'.
##

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Content-Type-Options   "nosniff" always;
add_header X-Frame-Options          "SAMEORIGIN" always;
add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
add_header Permissions-Policy       "geolocation=(), microphone=(), camera=(), payment=()" always;

# LabCare Diagnostics — Docker Compose (base stack)
#
# Serves the production build. One service, zero required configuration:
#
#   docker compose up -d --build      # → http://localhost:8585
#
# Optional services live in overlay files and are only parsed when you include them,
# so they can never break a plain `docker compose up`:
#
#   docker-compose.postgres.yml   PostgreSQL for a future backend
#     docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d
#
# Copy `.env.example` to `.env` to override ports or build-time values.
#
#   docker compose logs -f web        # follow logs
#   docker compose down               # stop (no volumes are used by this stack)

name: labcare

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Vite inlines VITE_* at build time. Keep these non-sensitive — they end
        # up in the browser bundle.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_ENABLE_DEMO_MODE: ${VITE_ENABLE_DEMO_MODE:-true}
        VITE_APP_NAME: ${VITE_APP_NAME:-LabCare Diagnostics}
    image: labcare-diagnostics:${LAB_CARE_TAG:-local}
    container_name: labcare-web
    ports:
      # host:container — nginx-unprivileged listens on 8080 inside the container
      - "${APP_PORT:-8585}:8080"
    environment:
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
